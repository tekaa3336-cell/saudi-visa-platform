<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سفريات النخبة | خدمات التأشيرة والسفر إلى السعودية</title>
    <meta name="description" content="منصة خدمات سفر وتأشيرات السعودية - مساعدة في إجراءات التأشيرة السياحية، زيارة عائلية، عمل، وعمرة" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; }
      html.light, html.light body { background-color: #f8fafc !important; color: #0f172a; }
      html.dark, html.dark body { background-color: #0f172a !important; color: #f1f5f9; }
    </style>
    <script>
      (function() {
        const saved = localStorage.getItem('theme');
        const theme = saved || 'light';
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
        const lang = localStorage.getItem('lang') || 'ar';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
